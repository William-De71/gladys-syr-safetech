name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Search and test** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → SYR SafeTech, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Result of "Search and test" and "Diagnostic"
      description: The message of the "Search and test" button, and the "SYR diagnostic" lines written to the logs of the integration by the "Diagnostic" button. Give the model of the device (SafeTech, SafeTech+, Trio, Pontos Base…), its firmware version, and what the SYR app shows at the same moment. If you can, attach the answer of http://<address>:5333/<path>/get/all (remove the serial number and the MAC addresses).
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The devices have no password: the logs hold no secret, only addresses, serial numbers and values.
      render: text
