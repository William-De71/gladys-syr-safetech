# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-syr-safetech:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, a SafeTech status converts into the
      # device and states of Gladys, the /data file is written with mode 0600.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-syr-safetech:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { parseStatus } = await import('/app/src/syr.js');
              const { buildDevice, buildStates, seenFeatures } = await import('/app/src/device.js');
              const { createStore } = await import('/app/src/store.js');
              const { statSync } = await import('node:fs');
              const raw = { getSRN: '987650001', getVER: 'Safe-Tech V4.08', getAB: '1', getVLV: '20', getALA: 'FF', getBAR: '4900 mbar', getCEL: '173', getFLO: '0', getVOL: 'Vol[L]1885', getLTV: '12', getAVO: '0mL', getBAT: '9,36', getPRF: '1', getPRN: '2', getPN1: 'Anwesend', getPN2: 'Abwesend', getPA1: '1', getPA2: '1' };
              const { id, ...values } = parseStatus(raw, '/safe-tec');
              const device = { id, serial: values.serial, path: '/safe-tec', model: values.model, values, present: {} };
              for (const key of seenFeatures(values)) device.present[key] = true;
              const ids = { externalIds: (type, id) => ({ device: 'ext:syr:' + type + ':' + id, feature: (key) => 'ext:syr:' + type + ':' + id + ':' + key }) };
              const built = buildDevice(ids, device);
              const states = buildStates(ids, device, { todayLiters: 0 });
              const store = createStore();
              await store.save();
              const mode = statSync(store.path).mode & 0o777;
              if (typeof createApp !== 'function' || built.features.length !== 12 || states.length !== 12 || mode !== 0o600) {
                console.log(built.features.length, states.length, mode.toString(8));
                process.exit(1);
              }
              console.log('modules load, a SafeTech status converts into 12 features and 12 states, /data/syr.json is 0600');
            "
